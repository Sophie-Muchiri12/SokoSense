# Render Blueprint for SokoSense — BACKEND ONLY
#
# Deployment topology:
#   * Backend  (this file)  — FastAPI on Render
#   * Frontend              — Vercel (see frontend/vercel.json)
#   * Database              — Supabase Postgres + pgvector (DATABASE_URL)
#
# Usage:
#   1. Push this file to GitHub.
#   2. Render Dashboard → New → Blueprint → pick the SokoSense repo.
#   3. Fill in the secret env vars marked `sync: false` (DATABASE_URL is the
#      Supabase transaction-pooler connection string, port 6543).
#   4. After the API is live, set VITE_API_URL on the Vercel project to the
#      API's public URL (e.g. https://sokosense-api.onrender.com).

services:
  - type: web
    name: sokosense-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # --- Supabase (Postgres + pgvector) ---
      - key: DATABASE_URL
        sync: false
      # --- Secrets: set these in the Render dashboard (never commit values) ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TAVILY_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: AT_SMS_SHORTCODE
        sync: false
      # --- Auth: REQUIRED in production ---
      # AUTH_SECRET signs login sessions (generate: openssl rand -hex 32).
      # Without it an ephemeral secret is used and all sessions die on restart.
      - key: AUTH_SECRET
        sync: false
      # 7-digit PIN for the admin portal (/admin-login).
      - key: ADMIN_PIN
        sync: false
