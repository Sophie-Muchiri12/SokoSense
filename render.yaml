# Render Blueprint for SokoSense
# Deploys two services:
#   1. sokosense-api  — FastAPI backend (Python)
#   2. sokosense-web  — TanStack Start SSR frontend (Node)
#
# Usage:
#   1. Push this file to GitHub.
#   2. Render Dashboard → New → Blueprint → pick the SokoSense repo.
#   3. Render reads this file and creates both services.
#   4. Fill in the secret env vars marked `sync: false`.
#   5. After the API is live, set VITE_API_URL on sokosense-web to the API's
#      public URL (e.g. https://sokosense-api.onrender.com) and redeploy the web
#      service so the URL is baked into the frontend build.

services:
  # ─────────────────────────── Backend (FastAPI) ───────────────────────────
  - type: web
    name: sokosense-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # --- Secrets: set these in the Render dashboard (never commit values) ---
      - key: FEATHERLSS_API_KEY
        sync: false
      - key: LLM_MODEL_FEATHERLESS
        value: deepseek-ai/DeepSeek-V4-Flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: 566e7c08
      - key: AURA_INSTANCEID
        sync: false
      - key: AURA_INSTANCENAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: AT_SMS_SHORTCODE
        sync: false

  # ─────────────────────────── Frontend (SSR) ───────────────────────────
  - type: web
    name: sokosense-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      # NITRO_PRESET makes the build emit a standalone Node server
      # (.output/server/index.mjs) instead of the default Cloudflare bundle.
      - key: NITRO_PRESET
        value: node-server
      # Public URL of sokosense-api. Baked into the build (Vite import.meta.env),
      # so it MUST be set before/at build time. Set it after the API is live,
      # then redeploy this service. Example: https://sokosense-api.onrender.com
      - key: VITE_API_URL
        sync: false
