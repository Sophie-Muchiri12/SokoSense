name: KAMIS Market Sync

on:
  schedule:
    # Every 3 hours (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-market-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh KAMIS SQLite cache
        env:
          MARKET_DB_PATH: data/market_prices.db
        run: python -m data.refresh_market_db

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_prices.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): sync KAMIS market prices"
            git push
          fi
